<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YongWeProperty</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>Lelang Gresik</h1>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Cari Property">
            <select id="filterDropdown">
                <option value="semua">Semua Kategori</option>
                <option value="Rumah">🏠 Rumah</option>
                <option value="Apartemen">🏢 Apartemen</option>
                <option value="Tanah">🌳 Tanah</option>
                <option value="Gudang">🏬 Gudang</option>
                <option value="Ruko">🏪 Ruko</option>
                <option value="Pabrik">🏭 Pabrik</option>
                <option value="Rumah Usaha">🏪 Rumah Usaha</option>
                <option value="Rumah Hitung Tanah">🏚️ Rumah Hitung Tanah</option>
            </select>
        </div>
    </div>

    <div class="gallery">
        <div class="container" id="galery">

            <div class="photo-card" data-name="Ruko">

                <div class="slider-wrapper" title="Klik untuk melihat foto selanjutnya">
                    <div class="slider-track">
                        <!-- Saya ubah ke foto 2 agar sesuai dengan daftar gambar di foldermu -->
                        <img src="lelang-grs-dibawah-1M.jpeg" alt="Tampak Depan">
                    </div>
                    <div class="click-hint">Klik foto 👆</div>
                </div>

                <!-- Area Spesifikasi / Teks -->
                <div class="card-content">
                    <span class="badge-lokasi">Ruko Mojopahit, Prajurit Kulon</span>
                    <h2 class="card-title">Ruko Mojopahit</h2>

                    <div class="card-specs">
                        <p><strong>LT:</strong> 419 m²| <strong>LB:</strong> 600 m²</p>
                        <p><strong>Lantai: 1</strong> | <strong>Surat:</strong> SHM</p>
                        <p><strong>Kamar Tidur: 2</strong> | <strong>Kamar Mandi: 1</strong></p>
                        <p>Belum Termasuk Pengosongan, Tunggakan, Kenaikan Bidding</p> <br>
                        <p>Segera Hubungi: <br>
                            YongWe Property</p>
                    </div>

                    <div class="card-price">
                        <span class="harga-coret"><small></small></span>
                        <span class="harga-promo">Rp 6,5M<small></small></span>
                        <p class="pajak-info">✔ Sudah Termasuk Pajak & Biaya2</p>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>


</body>

</html>
